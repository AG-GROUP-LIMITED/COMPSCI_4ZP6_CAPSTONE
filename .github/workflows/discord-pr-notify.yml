name: PR Notification to Discord

on:
  pull_request:
    types: [opened, reopened]
    branches:
      - main

jobs:
  discord_notification:
    runs-on: ubuntu-latest
    steps:
      - name: Send PR Status to Discord
        uses: appleboy/discord-action@master
        with:
          webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
          webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          username: "GitHub PR Bot"
          avatar_url: "https://githubassets.com"
          color: "#48f442"
          message: |
            @everyone Please review **${{ github.event.pull_request.user.login }}**'s PR to **${{ github.event.pull_request.base.ref }}**: 
            **Title**: "${{ github.event.pull_request.title }}"
            **URL**: ${{ github.event.pull_request.html_url }}
