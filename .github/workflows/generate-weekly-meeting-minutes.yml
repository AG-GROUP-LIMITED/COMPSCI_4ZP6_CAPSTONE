
name: Weekly Meeting Minutes

on:
  schedule:
    # Every Wednesday at 9:00 AM UTC
    - cron: '0 9 * * 3'
  workflow_dispatch:

jobs:
  generate_meeting_minutes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate meeting minutes file
        working-directory: meetings
        run: bash generate_meeding_file.sh

      - name: Commit generated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meetings/
          git diff --cached --quiet || git commit -m "chore: generate weekly meeting minutes"
          git push
